- id: llm-pi-ai
  # model-runtime mounts this adapter after local services are prepared. The
  # nested instance keeps the same settings namespace and user-settings layer.
  disabled: true

- insert:
    # DSH ships Schedule as an explicit Web opt-in. Minke enables the durable
    # host runtime and read-only conversation-header catalog together.
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # This is an additional credential-free tool, not a provider override.
    # Keep DSH's native web_search/web_fetch composition and provider selection
    # intact, including its credentials, retry UI, and structured failures.
    - id: minke-web-search
      name: '@lencx/minke-harness-overlay/web-search'
      disabled: !!js process.env.MINKE_WEB_SEARCH_FALLBACK_ENABLED === '0'
      config:
        baseURL: !!js process.env.MINKE_WEB_SEARCH_BASE_URL

    # Minke's two supported local-model runtimes stay configurable even when
    # their service is offline. Auto-start is an explicit desktop preference.
    - id: model-runtime
      name: '@lencx/minke-model-runtime/dsh'
      config:
        lmStudio:
          enabled: true
          lifecycle: !!js "process.env.MINKE_LM_STUDIO_ENABLED === '1' && process.env.MINKE_LM_STUDIO_COMMAND ? 'ensure-running' : 'external'"
          command: !!js process.env.MINKE_LM_STUDIO_COMMAND
          baseURL: !!js process.env.LM_STUDIO_BASE_URL
        ollama:
          enabled: true
          lifecycle: !!js "process.env.MINKE_OLLAMA_ENABLED === '1' && process.env.MINKE_OLLAMA_COMMAND ? 'ensure-running' : 'external'"
          command: !!js process.env.MINKE_OLLAMA_COMMAND
          baseURL: !!js process.env.OLLAMA_BASE_URL

    - id: minke-overlay
      name: '@lencx/minke-harness-overlay'
      config:
        rootPath: !!js process.env.MINKE_HOST_ROOT

- id: ui-schedule
  disabled: false

# >>> minke-fork
# Fork 自有的组合块，一律追加在文件末尾：上游在中间新增行时 3-way merge 不冲突。
# 约定见仓库根的 FORK.md。
- insert:
    # Claude Code subagent：上游 harness 自带但 Minke 没组合。一个 provider +
    # 一个 tool-subagent 实例。登录、模型、沙箱全部由本机 claude CLI 自己拥有，
    # 这里既不装 CLI 也不碰它的配置。
    # 注意：上游 v0.2.0 把原来同构的 codex 那组从这里删掉了，改成让用户自己
    # `dsh plugin --profile web add @deepseek-ai/dsh-subagent-codex` 装。
    # fork 这里保持内置组合，因为 mcp-client 的实例要在运行时动态挂载，
    # 走不了 plugin add 那条路；两者共用 productBundle.runtimePackages 机制。
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: true
        backgroundMode: one-shot
        maxDepth: provider-managed

    # MCP 客户端。真正的实例由下面的 minke-fork 在运行时按
    # $DSH_HOME/minke-mcp.json 逐条挂载，一个 server 一个实例。
    # 这一行是禁用的模板行：它让 mcp-client 保持被组合层显式声明，
    # 从而留在 runtime closure 里（contract 校验 runtimePackages 必须在此出现）。
    - id: mcp-client-template
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: template
        transport: stdio
        command: 'true'

    # Fork 唯一的 host 插件入口。以后加 fork 功能只改
    # packages/harness-overlay/src/fork/**，这里不再增行。
    - id: minke-fork
      name: '@lencx/minke-harness-overlay/fork'
# <<< minke-fork
